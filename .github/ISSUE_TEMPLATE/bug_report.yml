name: Bug report
description: The validator, release check or demo behaves differently from the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not paste private records, tokens or real logs.
        Security problems go through [SECURITY.md](../blob/main/SECURITY.md), not a public issue.
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest command and synthetic input that shows the problem.
      placeholder: |
        printf '{"a":1}\n' > sample.jsonl
        python -B jsonl_utf8_guard.py --input sample.jsonl
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output and exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python 3.12, Windows 11
    validations:
      required: true
